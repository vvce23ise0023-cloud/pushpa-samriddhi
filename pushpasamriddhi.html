 // 6. OTP SIGN-IN PORTAL
 function Login() {
 const { t } = useLanguage();
 const { loginUser } = useApp();
 const [phone, setPhone] = useState('');
 const [otp, setOtp] = useState('');
 const [step, setStep] = useState(1);
 const [mockOtp, setMockOtp] = useState('');
 const [errorMsg, setErrorMsg] = useState('');
 const handleSend = (e) => {
 e.preventDefault();
 if (phone.length !== 10) { setErrorMsg(t('invalidPhone')); return; }
 setErrorMsg('');
 const code = Math.floor(1000 + Math.random() * 9000).toString();
 setMockOtp(code); setStep(2);
 };
 const handleVerify = (e) => {
 e.preventDefault();
 if (otp === mockOtp || otp === '1234') loginUser(phone);
 else setErrorMsg(t('invalidOtp'));
 };

 ),

 step === 1 ? React.createElement('form', { onSubmit: handleSend, style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
 React.createElement('div', { className: "input-group" },
 React.createElement('label', null, t('phoneLabel')),
 React.createElement('input', { type: "tel", maxLength: "10", value: phone, onChange: (e) => setPhone(e.target.value.replace(/\D/g, '')), placeholder: t('phonePlaceholder'), required: true, style: { textAlign: 'center', fontWeight: 600 } })
 ),
 React.createElement('button', { type: "submit", className: "btn btn-primary" }, t('sendOtp'))
 ) : React.createElement('form', { onSubmit: handleVerify, style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
 React.createElement('div', { className: "input-group" },
 React.createElement('label', null, t('otpLabel')),
 React.createElement('input', { type: "text", maxLength: "4", value: otp, onChange: (e) => setOtp(e.target.value.replace(/\D/g, '')), placeholder: "Enter code", required: true, style: { textAlign: 'center', fontWeight: 700, letterSpacing: '4px' } })
 ),
 React.createElement('div', { style: { backgroundColor: 'var(--secondary-light)', borderLeft: '4px solid var(--secondary)', padding: '10px', borderRadius: '8px', fontSize: '0.8rem', textAlign: 'center' } },
 `${t('mockOtpAlert')} `, React.createElement('b', { style: { color: 'var(--primary)', fontSize: '0.95rem' } }, mockOtp),
 React.createElement('span', { style: { display: 'block', fontSize: '0.7rem', color: 'var(--text-secondary)' } }, "(Or enter 1234 to bypass)")
 ),
 React.createElement('button', { type: "submit", className: "btn btn-primary" }, t('verifyOtp')),
 React.createElement('button', { type: "button", onClick: () => { setStep(1); setErrorMsg(''); }, style: { background: 'none', border: 'none', color: 'var(--primary)', fontWeight: 600, fontSize: '0.8rem', cursor: 'pointer' } }, "← Edit Number")
 )
 )
 );
